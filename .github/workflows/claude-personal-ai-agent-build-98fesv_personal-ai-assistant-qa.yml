# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - personal-ai-assistant-qa

on:
  push:
    branches:
      - claude/personal-ai-agent-build-98fesv
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # This is required for requesting the JWT
      contents: read # This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '22.x'

      - name: npm ci, build, and test
        run: |
          npm ci
          npm run build --if-present
          npm run test --if-present

      - name: Remove files not needed at runtime
        run: rm -rf .git data/test.db

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_BA31BE4F71D049FB9D28E2473AD6780D }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_A32759E2E2B64DAFA2085E6CEF9B3CAF }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_CB0C5189A6504395AED2E925A127F12E }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'personal-ai-assistant-qa'
          slot-name: 'Production'
          package: .
