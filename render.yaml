# Render Blueprint for the Personal AI Assistant.
#
# NOTE ON VERIFICATION: render.com, docs.render.com, and
# render-web.onrender.com are all unreachable from this sandbox's network
# egress, so this file could not be checked directly against Render's own
# Blueprint spec page. It WAS cross-checked via web search against
# several independent, real, currently-published render.yaml examples for
# other production apps with an attached disk (Strapi's own hosting docs,
# ElectricSQL's Render integration docs, Render's own render-examples
# GitHub org) plus a structured third-party reference — every field below
# (runtime, buildCommand/startCommand, healthCheckPath, the disk block's
# name/mountPath/sizeGB shape, envVars' sync:false semantics, and valid
# `plan` values including "starter") matched across all of them. That's
# meaningfully stronger evidence than an unverified guess, but it is
# still not the same as reading Render's own current docs directly —
# sanity-check this against the Render dashboard's own render.yaml
# reference during your first Blueprint sync, and adjust anything its
# parser rejects.
#
# Architecture (unchanged from the existing app, not adapted to
# serverless): a single long-running Node.js process (`next start`)
# reading/writing one SQLite file on a persistent disk. This is NOT
# horizontally scalable — better-sqlite3 is a single-writer, single-process
# connection. No `scaling`/`numInstances` block is configured here, and
# per the same sources above, Render does not allow horizontal scaling on
# a service with an attached persistent disk in the first place — so
# single-instance is both this app's requirement and a platform-enforced
# constraint once the disk below is attached, not just a convention this
# file follows.

services:
  - type: web
    name: personal-ai-assistant
    runtime: node
    plan: starter # Persistent disks require a paid plan on Render — the free tier does not support them.
    # region: oregon   # Valid values (per the sources above): oregon | ohio | virginia | frankfurt | singapore.
    # Uncomment and pick the region nearest you; left unset here (defaults to oregon) rather than guessed on your behalf.
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health

    disk:
      name: personal-ai-assistant-data
      mountPath: /var/data # Confirmed correct: this becomes DATABASE_PATH's parent directory below, persisted across deploys/restarts.
      sizeGB: 1 # SQLite + WAL files are a few MB today; 1GB is generous headroom. Render's default is 10GB if omitted; can be increased later but not decreased.

    envVars:
      # --- Non-secret, safe to set directly in this file ---
      - key: NODE_ENV
        value: production
      - key: DATABASE_PATH
        value: /var/data/app.db
      # Render's own load balancer sits in front of this service and sets
      # X-Forwarded-For/X-Real-IP correctly (stripping any client-supplied
      # copy first) — true is the correct, safe setting here specifically
      # because Render is doing the proxying, not merely present. See the
      # comment on TRUST_PROXY in src/lib/env.ts for what this protects.
      - key: TRUST_PROXY
        value: "true"
      - key: OPENAI_MODEL
        value: gpt-4o-mini

      # --- Secrets: intentionally have NO value here. `sync: false` tells
      # Render to prompt for each of these in the dashboard at deploy
      # time (or you set them manually after the first deploy) — their
      # real values must never be written into this file or committed to
      # git. See README's "Setup" and "Production Readiness" sections for
      # what each one is and how to obtain it. ---
      - key: OPENAI_API_KEY
        sync: false
      - key: AUTH_USER_EMAIL
        sync: false
      - key: AUTH_USER_NAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: APP_ENCRYPTION_KEY
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      - key: GOOGLE_OAUTH_REDIRECT_URI
        sync: false
      - key: MICROSOFT_OAUTH_CLIENT_ID
        sync: false
      - key: MICROSOFT_OAUTH_CLIENT_SECRET
        sync: false
      - key: MICROSOFT_OAUTH_REDIRECT_URI
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
